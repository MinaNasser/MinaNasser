name: GitHub Snake Game

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: github-snake
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Contribution Snake
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Snake Animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=00A86B&color_dots=#90EE90,#3CB371,#2E8B57,#1E5A3A,#0F3B21
            dist/github-snake-dark.svg?palette=github-dark&color_snake=00A86B&color_dots=#1E5A3A,#2E8B57,#3CB371,#50C878,#00A86B
            dist/github-snake.gif?color_snake=00A86B&color_dots=#90EE90,#3CB371,#2E8B57,#1E5A3A,#0F3B21
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Snake Animations
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "chore: update GitHub contribution snake"
