name: GitHub Snake Game

on:
  # Schedule the workflow to run daily at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  # Allow manual triggering of the workflow
  workflow_dispatch:
  # Trigger the workflow on pushes to the main branch
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3
        
      # Step 2: Generate the snake animations with Emerald Green colors
      - name: Generate GitHub Contributions Snake Animations
        uses: Platane/snk@v3
        with:
          # GitHub username to generate the animation for
          github_user_name: ${{ github.repository_owner }}
          # Define the output files with Emerald Green color scheme
          outputs: |
            dist/github-snake.svg?color_snake=00A86B&color_dots=#90EE90,#3CB371,#2E8B57,#1E5A3A,#0F3B21
            dist/github-snake-dark.svg?palette=github-dark&color_snake=00A86B&color_dots=#1E5A3A,#2E8B57,#3CB371,#50C878,#00A86B
            dist/ocean.gif?color_snake=00A86B&color_dots=#90EE90,#3CB371,#2E8B57,#1E5A3A,#0F3B21
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # Step 3: Deploy the generated files to the 'output' branch
      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update snake animation with Emerald Green colors [skip ci]"
